<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>编辑文章 — zw-blog 原型</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="site-header">
        <a class="brand" href="admin-posts.html">
          <span class="brand-mark">ZW</span>
          <span class="brand-name">后台</span>
        </a>
        <nav>
          <a href="admin-posts.html">文章</a>
          <a href="admin-about.html">关于我</a>
        </nav>
      </header>

      <h1 class="page-title">编辑文章</h1>
      <form>
        <div class="field">
          <label for="title">标题</label>
          <input id="title" name="title" value="SQLite FTS5 够用的时候，就不要上搜索引擎" required />
        </div>
        <div class="field">
          <label for="slug">短链接</label>
          <input id="slug" name="slug" value="sqlite-fts5" />
        </div>
        <div class="field">
          <label for="excerpt">摘要</label>
          <input id="excerpt" name="excerpt" value="个人博客的检索往往被做成独立服务。" />
        </div>
        <div class="field">
          <label for="tags">标签（逗号分隔）</label>
          <input id="tags" name="tags" value="技术" />
        </div>
        <div class="field">
          <label for="file">上传配图</label>
          <input id="file" name="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" />
        </div>
        <div class="editor-grid">
          <div class="field">
            <label for="body">正文 Markdown</label>
            <textarea id="body" name="body">个人站点的访问模式很简单。

```sql
SELECT article_id FROM articles_fts
WHERE articles_fts MATCH 'FTS5';
```
</textarea>
          </div>
          <div class="panel">
            <p class="meta">预览</p>
            <div class="prose">
              <p>个人站点的访问模式很简单。</p>
              <pre><code>SELECT article_id FROM articles_fts
WHERE articles_fts MATCH 'FTS5';</code></pre>
            </div>
          </div>
        </div>
        <p>
          <button class="btn" type="button">保存草稿</button>
          <button class="btn" type="button">发布</button>
          <button class="btn-ghost" type="button">撤回为草稿</button>
        </p>
      </form>
    </div>
  </body>
</html>
